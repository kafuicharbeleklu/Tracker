<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Mesure des viewports</title>
<style>body{font:12px ui-monospace,monospace;margin:0;padding:14px;background:#111;color:#eee}iframe{border:0;position:absolute;left:-9999px;top:0}pre{white-space:pre-wrap;line-height:1.65}</style>
</head><body>
<pre id="out">mesure…</pre>
<script>
const FILES = ["regimes-2-rail-piste.html","regimes-3-sans-rail-piste.html","audit-1-vue-globale-piste.html","audit-2-campagne-piste.html","attribution-1-parcours-piste.html","attribution-2-preuve-piste.html","attribution-3-fins-de-flux-piste.html","attribution-4-demander-piste.html","attribution-5-arbitrer-piste.html","catalogue-1-referentiel-piste.html","catalogue-2-modele-piste.html","dashboard-1-tableau-piste.html","dashboard-2-atraiter-piste.html","dashboard-3-taches-piste.html","direction-compact-piste.html","emplacements-1-referentiel-piste.html","equipement-1-liste-piste.html","equipement-2-detail-piste.html","equipement-3-creation-piste.html","equipement-4-incident-suite-piste.html","etats-piste.html","finances-1-rapports-piste.html","lexique-piste.html","login-2-premiere-connexion-piste.html","login-piste.html","mon-compte-piste.html","parametres-piste.html","regimes-piste.html","roles-1-permissions-piste.html","transverses-1-selection-piste.html","transverses-2-attente-scan-piste.html","utilisateur-1-liste-piste.html","utilisateur-2-detail-piste.html","utilisateur-3-creation-piste.html","utilisateur-4-compte-piste.html"];
const out = document.getElementById('out');
const rows = [];
function paint(){ out.textContent = rows.join('\n'); }
async function declared(f){
  try { const t = await (await fetch('../screens/' + f)).text();
    const m = t.match(/viewport="(\d+)x(\d+)"/);
    return m ? {w:+m[1], h:+m[2]} : {w:0, h:0};
  } catch(e){ return null; }
}
function measure(f, w){
  return new Promise(res=>{
    let done = false;
    const fin = (v) => { if(done) return; done = true; res(v); };
    const fr = document.createElement('iframe');
    fr.style.width = w + 'px'; fr.style.height = '600px';
    fr.onload = () => setTimeout(()=>{
      try { const d = fr.contentDocument;
        fin({h: Math.max(d.documentElement.scrollHeight, d.body.scrollHeight),
             sw: Math.max(d.documentElement.scrollWidth, d.body.scrollWidth)});
      } catch(e){ fin({h:0, sw:0, err:'accès refusé'}); }
      fr.remove();
    }, 800);
    fr.onerror = () => fin({h:0, sw:0, err:'chargement'});
    setTimeout(()=>fin({h:0, sw:0, err:'délai'}), 6000);
    fr.src = '../screens/' + f;
    document.body.appendChild(fr);
  });
}
(async()=>{
  for (const f of FILES) {
    const dec = await declared(f);
    const w = (dec && dec.w) ? dec.w : 1400;
    const m = await measure(f, w);
    const name = f.replace('-piste.html','').padEnd(28);
    if (m.err) { rows.push(name + '!! ' + m.err); paint(); continue; }
    if (!dec || !dec.w) { rows.push(name + 'AUCUN viewport déclaré · mesuré à 1400px : ' + m.sw + 'x' + m.h + '  ← À DÉCLARER'); paint(); continue; }
    const clip = m.h - dec.h;
    rows.push(name + (dec.w+'x'+dec.h).padEnd(11) + '· réel ' + String(m.h).padEnd(6)
      + (clip > 0 ? '· COUPÉ de ' + clip : '· ok (' + clip + ')')
      + (m.sw > dec.w + 4 ? '  · LARGEUR coupée de ' + (m.sw - dec.w) : ''));
    paint();
  }
  rows.push(''); rows.push('— fin, ' + FILES.length + ' planches —'); paint();
})();
</script>
</body></html>
