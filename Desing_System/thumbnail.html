<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:854px;overflow:hidden}
.tile{width:1280px;height:854px;display:flex}
.main{flex:1;background:#FDC910;display:flex;align-items:center;justify-content:center}
.main span{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:200px;color:#1A1917;letter-spacing:-.02em}
.strip{width:320px;height:854px;display:flex;flex-direction:column}
.strip div{flex:1}
</style>
</head>
<body>
<div class="tile">
<div class="main"><span>Tracker</span></div>
<div class="strip">
<div style="background:#FEF3D6"></div>
<div style="background:#1B7F4D"></div>
<div style="background:#B3261E"></div>
<div style="background:#8A6508"></div>
</div>
</div>
</body>
</html>
