<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tracker</title>
  <meta name="description" content="Plateforme centralisee de gestion des actifs informatiques — Tracker" />

  <!-- PWA : installable (manifest + icône de marque + couleur de thème) -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#FDC910" />

  <!-- Tailwind utilities are compiled at build time (Vite + @tailwindcss/vite). -->

  <!--
    Les fontes du système : Inter pour le texte, Archivo pour l'affichage.
    Elles sont déclarées ICI et non par un `@import` dans `index.css` : derrière un
    import CSS, le navigateur doit d'abord recevoir et analyser la feuille avant de
    découvrir les fontes, si bien que le premier rendu se fait dans la fonte de repli
    du système et bascule ensuite. Un `<link>` dans la tête les demande tout de suite.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Archivo:wght@500;600&display=swap"
    rel="stylesheet">

  <!-- Google Fonts: Material Symbols Outlined -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
